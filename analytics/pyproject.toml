[project]
name = "homi-analytics"
version = "0.1.0"
description = "Funnel analytics, diagnosis and a user simulator for Homi's event data"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "streamlit>=1.40",
    "plotly>=5.24",
    "matplotlib>=3.9",  # table color scales in the dashboard
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["homi_analytics*"]

[tool.setuptools.package-data]
homi_analytics = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["homi_analytics", "app"]
known-third-party = ["alembic"]
