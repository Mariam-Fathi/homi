name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homi
          POSTGRES_PASSWORD: homi
          POSTGRES_DB: homi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homi -d homi_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://homi:homi@localhost:5432/homi_test
      DATABASE_URL: postgresql+psycopg://homi:homi@localhost:5432/homi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests (schema is built through the real migrations)
        run: pytest
      - name: Models and migrations are in sync
        run: alembic check

  mobile:
    name: Mobile (types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  smoke:
    name: End-to-end smoke test (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T api python -m app.seed
      - run: python3 backend/scripts/smoke_test.py http://localhost:8000
      - if: failure()
        run: docker compose logs api
